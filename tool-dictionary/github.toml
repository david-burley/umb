# GitHub MCP Server — official @modelcontextprotocol/server-github
# Canonical source: https://github.com/modelcontextprotocol/servers/tree/main/src/github
#
# Curator notes:
#   The largest single-server tool surface in the ecosystem (~26 tools).
#   Descriptions mirror the REST API verbatim with extensive parameter
#   prose. The hand-curated short forms below cover the highest-impact
#   tools; less-used tools (gist mgmt, codespaces, etc.) inherit from
#   server live def until further curation. No hash-guard — we want these
#   to keep applying across GitHub server version bumps.

[metadata]
server_name = "github"
upstream_canonical_source = "https://github.com/modelcontextprotocol/servers/tree/main/src/github"
curator = "umb-core"
reviewed_at = "2026-05-20"

